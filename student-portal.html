<title>Portal do Aluno</title>
<style>
:root{color-scheme:dark;--bg:#090909;--card:#141414;--card2:#1c1c1c;--text:#f5f3eb;--muted:#aaa79f;--accent:#d6b25e;--line:#34312a;--ok:#7dd3a7;--bad:#ff8f8f}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(circle at top,#232019 0,#0b0b0b 36%,#060606 100%);color:var(--text);min-height:100vh}.wrap{width:min(760px,100%);margin:0 auto;padding:20px 16px 48px}.brand{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 4px}.brand small,.eyebrow{color:var(--accent);font-size:11px;font-weight:800;letter-spacing:.14em}.brand strong{display:block;font-size:18px}.lock{border:1px solid var(--line);border-radius:999px;padding:8px 11px;color:var(--muted);font-size:12px}.card{background:linear-gradient(180deg,rgba(28,28,28,.98),rgba(17,17,17,.98));border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.28);margin-bottom:14px}.hero h1{font-size:27px;margin:7px 0 8px}.hero p,.muted{color:var(--muted);line-height:1.5}.field{margin:14px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:7px}.field input{width:100%;padding:14px;border-radius:14px;border:1px solid #3a372f;background:#0e0e0e;color:var(--text);font-size:16px;outline:none}.field input:focus{border-color:var(--accent)}.trust-option{display:flex;align-items:flex-start;gap:10px;margin:8px 0 16px;padding:12px 13px;border:1px solid var(--line);border-radius:14px;background:#11110f}.trust-option input{margin-top:3px;accent-color:var(--accent)}.trust-option span{display:grid;gap:3px}.trust-option strong{font-size:13px}.trust-option small{color:var(--muted);font-size:11px;line-height:1.4}button{appearance:none;border:0;border-radius:14px;padding:13px 16px;font-weight:800;font-size:14px;cursor:pointer}button.primary{background:var(--accent);color:#12100a}button.secondary{background:#28251f;color:var(--text);border:1px solid #3d392f}button:disabled{opacity:.55;cursor:wait}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.notice{padding:13px 14px;border:1px solid #3b372f;border-radius:14px;background:#161511;color:var(--muted);font-size:13px;line-height:1.45}.notice.ok{border-color:#315542;color:#b9e8cf}.notice.bad{border-color:#653939;color:#ffc1c1}.identity{display:flex;align-items:center;gap:13px}.avatar{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;background:#2b261b;color:var(--accent);font-size:20px;font-weight:900}.identity strong{display:block;font-size:18px}.identity span{color:var(--muted);font-size:13px}.tabs{display:flex;gap:8px;overflow:auto;padding:4px 0 10px}.tabs button{white-space:nowrap;background:#1d1b17;color:var(--muted);padding:10px 12px}.tabs button.active{color:#15120b;background:var(--accent)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.metric{border:1px solid var(--line);border-radius:16px;padding:14px;background:#101010}.metric span{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em}.metric strong{display:block;margin-top:7px;font-size:18px}.list{display:grid;gap:8px}.row{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid #2c2a25}.row:last-child{border-bottom:0}.row span{color:var(--muted);font-size:12px}.row strong{display:block;color:var(--text);font-size:14px}.row em{font-style:normal;color:var(--accent);font-size:12px}.section-title{margin:3px 0 14px}.section-title small{color:var(--accent);font-weight:800;letter-spacing:.12em}.section-title h2{font-size:20px;margin:4px 0}.password-offer h2,.password-sheet h2{margin:7px 0 8px;font-size:21px}.password-offer p{color:var(--muted);line-height:1.5}.password-layer{position:fixed;inset:0;z-index:99;background:rgba(0,0,0,.78);display:grid;place-items:center;padding:18px;overflow:auto}.password-sheet{width:min(520px,100%);margin:auto}.portal-flash{margin-bottom:14px}.footer{padding:20px 4px;color:#77736b;text-align:center;font-size:12px}@media(max-width:520px){.wrap{padding:12px 12px 36px}.card{padding:17px;border-radius:19px}.grid{grid-template-columns:1fr}.hero h1{font-size:24px}}
</style>
</head>
<body><main class="wrap"><header class="brand"><div><small>MB GESTOR</small><strong>Portal do Aluno</strong></div><div class="lock">🔒 acesso protegido</div></header><div id="app"></div><footer class="footer">Somente leitura • acesso individual protegido</footer></main><script src="student-portal.js?v=13.2.0"></script></body></html>
